<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Offsuit · 德州撲克</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, "SF Pro Display", "Inter", system-ui, "PingFang TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #game { width: 100%; height: 100%; }
    /* DEV 微調面板 */
    #dev {
      position: fixed; top: 0; right: 0; width: 280px; max-height: 100vh;
      overflow-y: auto; background: rgba(18,18,20,.96); color: #eee;
      font: 12px/1.4 -apple-system, system-ui, sans-serif; padding: 10px 12px;
      display: none; z-index: 9999; border-left: 1px solid #333;
    }
    #dev.open { display: block; }
    #dev h3 { font-size: 13px; margin-bottom: 6px; color: #e8d44d; }
    #dev .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #dev .row label { flex: 0 0 96px; color: #aaa; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #dev input[type=range] { flex: 1; min-width: 0; }
    #dev .val { flex: 0 0 38px; text-align: right; color: #fff; }
    #dev button {
      width: 100%; margin-top: 8px; padding: 8px; background: #e8d44d; color: #000;
      border: 0; border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    #dev .hint { color: #777; font-size: 10px; margin: 6px 0; }
    #devTip {
      position: fixed; left: 8px; bottom: 8px; color: rgba(255,255,255,.25);
      font: 10px system-ui; z-index: 9998; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="devTip">按 D 開發者微調</div>
  <div id="dev"><h3>🛠 LAYOUT 微調</h3><div id="devBody"></div>
    <div class="hint">拖滑桿即時預覽。調好後按下方匯出，把 JSON 給 Claude baked 進原始碼。</div>
    <button id="devExport">💾 匯出 LAYOUT JSON</button>
  </div>
  <script src="./vendor/phaser.min.js"></script>
  <script src="./src/sfx.js"></script>
  <script src="./src/engine.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
