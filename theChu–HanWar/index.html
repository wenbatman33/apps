<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>楚漢爭霸 · 倍數連消老虎機</title>
    <!-- 毛筆書法字體（Ma Shan Zheng 楷書 / ZCool 行草 / Liu Jian Mao Cao 草書）-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0604;
        color: #f5d27a;
        font-family: "Noto Serif TC", "Songti TC", serif;
        overflow: hidden;
        height: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        /* 高品質縮放：避免畫面被瀏覽器再做 nearest-neighbor 放大造成鋸齒 */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: high-quality;
        image-rendering: auto;
      }
      img { image-rendering: high-quality; }
      /* HTML loading 層（Phaser 啟動前顯示，啟動後 main.js 移除） */
      #boot-cover {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0604;
        display: flex; align-items: center; justify-content: center;
        color: #f5d27a;
        font-family: "Ma Shan Zheng", "Liu Jian Mao Cao", "ZCOOL KuaiLe", "Noto Serif TC", serif;
        font-size: 36px; letter-spacing: 8px;
        transition: opacity 0.6s ease;
      }
      #boot-cover.fade { opacity: 0; pointer-events: none; }
      #boot-cover .ink {
        font-family: "Liu Jian Mao Cao", "Ma Shan Zheng", serif;
        font-size: 96px; font-weight: 400;
        text-shadow: 0 0 30px rgba(245,210,122,0.5), 0 6px 18px rgba(0,0,0,0.9);
        margin-bottom: 24px; letter-spacing: 16px;
      }
      #boot-cover .dots::after { content: ''; display: inline-block; width: 1.5em;
        text-align: left; animation: dot 1.2s infinite steps(4); }
      @keyframes dot { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
    </style>
  </head>
  <body>
    <div id="boot-cover"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
