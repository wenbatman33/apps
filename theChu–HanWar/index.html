<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>楚漢爭霸 · 倍數連消老虎機</title>
    <!-- 毛筆書法字體（Ma Shan Zheng 楷書 / ZCool 行草 / Liu Jian Mao Cao 草書）-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0604;
        color: #f5d27a;
        font-family: "Noto Serif TC", "Songti TC", serif;
        overflow: hidden;
        height: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        /* 高品質縮放：避免畫面被瀏覽器再做 nearest-neighbor 放大造成鋸齒 */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: high-quality;
        image-rendering: auto;
      }
      img { image-rendering: high-quality; }
      /* HTML loading 層（Phaser 啟動前顯示，啟動後 main.js 移除） */
      #boot-cover {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0604;
        display: flex; align-items: center; justify-content: center;
        color: #f5d27a;
        font-family: "Ma Shan Zheng", "Liu Jian Mao Cao", "ZCOOL KuaiLe", "Noto Serif TC", serif;
        font-size: 36px; letter-spacing: 8px;
        transition: opacity 0.6s ease;
      }
      #boot-cover.fade { opacity: 0; pointer-events: none; }
      #boot-cover .ink {
        font-family: "Liu Jian Mao Cao", "Ma Shan Zheng", serif;
        font-size: 96px; font-weight: 400;
        text-shadow: 0 0 30px rgba(245,210,122,0.5), 0 6px 18px rgba(0,0,0,0.9);
        margin-bottom: 24px; letter-spacing: 16px;
      }
      #boot-cover .dots::after { content: ''; display: inline-block; width: 1.5em;
        text-align: left; animation: dot 1.2s infinite steps(4); }
      @keyframes dot { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
    </style>
  </head>
  <body>
    <div id="boot-cover"></div>
    <div id="game"></div>

    <!-- ============== DEV 微調 / 狀態測試面板 ============== -->
    <!-- 手機版用浮動 D 按鈕（PC 用 D 鍵） -->
    <button id="dev-toggle-btn" style="
      position: fixed; right: 8px; bottom: 8px; z-index: 1001;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(15,10,8,0.92); border: 2px solid #d4a54a;
      color: #f5d27a; font-size: 22px; cursor: pointer;
      display: none;
    ">🛠️</button>

    <div id="dev-panel" style="
      position: fixed; right: 12px; top: 12px; z-index: 1000;
      background: rgba(15,10,8,0.92); border: 1px solid #d4a54a;
      padding: 12px; border-radius: 8px; color: #f5d27a;
      font-family: 'Noto Sans TC', sans-serif; font-size: 13px;
      max-width: 240px; max-height: 90vh; overflow-y: auto;
      display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    ">
      <div style="font-weight:900; font-size:14px; margin-bottom:8px; letter-spacing:2px;">
        🛠️ DEV 模式 <span style="float:right;cursor:pointer;color:#999;" id="dev-close">✕</span>
      </div>
      <div style="font-size:11px; color:#999; margin-bottom:10px;">D 鍵切換 | ?dev=1 也可開</div>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin-bottom:6px; font-weight:700;">💰 BIG WIN</div>
      <button class="dev-btn" data-action="bigwin" data-arg="200">小贏 (×10)</button>
      <button class="dev-btn" data-action="bigwin" data-arg="2000">中贏 (×100)</button>
      <button class="dev-btn" data-action="bigwin" data-arg="10000">大贏 (×500)</button>
      <button class="dev-btn" data-action="bigwin" data-arg="50000">傳奇 (×2500)</button>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin:8px 0 6px; font-weight:700;">🎁 Free Game</div>
      <button class="dev-btn" data-action="fg-start">FG 開始 (15 spins)</button>
      <button class="dev-btn" data-action="fg-end">FG 結算 (戰罷凱旋)</button>
      <button class="dev-btn" data-action="fg-total">累計連發 overlay</button>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin:8px 0 6px; font-weight:700;">⭐ Manga Overlay</div>
      <button class="dev-btn" data-action="overlay-scatter">Scatter (CHANCE)</button>
      <button class="dev-btn" data-action="overlay-scatter-edit" style="background:linear-gradient(180deg,#5a2a08,#3a1a04);">✋ 編輯 Scatter 位置（可拖曳）</button>
      <div id="coord-display" style="display:none;">
        <div style="font-size:10px; color:#999; margin-top:4px;">拖曳後座標：</div>
        <input id="coord-input" readonly style="
          width: 100%; box-sizing: border-box;
          font-family: monospace; font-size: 16px; font-weight: 900;
          padding: 8px; background: #000; color: #ff0;
          border: 2px solid #d4a54a; border-radius: 4px;
          text-align: center; cursor: text;
        " value="尚未拖曳" />
        <div style="font-size:10px; color:#999; margin-top:2px;">↑ 直接點選複製，或按下方按鈕</div>
      </div>
      <button class="dev-btn" data-action="copy-coord" style="display:none;" id="copy-coord-btn">📋 複製到剪貼簿</button>
      <button class="dev-btn" data-action="overlay-mult" data-arg="5">倍數 ×5</button>
      <button class="dev-btn" data-action="overlay-mult" data-arg="25">倍數 ×25</button>
      <button class="dev-btn" data-action="overlay-mult" data-arg="100">倍數 ×100</button>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin:8px 0 6px; font-weight:700;">📖 章節頁</div>
      <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:3px;">
        <button class="dev-btn-mini" data-action="page" data-arg="1">1</button>
        <button class="dev-btn-mini" data-action="page" data-arg="5">5</button>
        <button class="dev-btn-mini" data-action="page" data-arg="10">10</button>
        <button class="dev-btn-mini" data-action="page" data-arg="15">15</button>
        <button class="dev-btn-mini" data-action="page" data-arg="20">20</button>
      </div>
      <button class="dev-btn" data-action="page-next">⏭ 下一頁</button>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin:8px 0 6px; font-weight:700;">🔧 Layout 編輯</div>
      <button class="dev-btn" data-action="layout-edit" style="background:linear-gradient(180deg,#1a3a1a,#0e2010);border-color:#4a8a4a;font-size:13px;padding:10px;">
        🔧 進入 / 離開 元件拖曳編輯模式
      </button>
      <div style="font-size:10px;color:#888;margin-bottom:6px;">拖紅色把手 → 移動元件 → 💾 匯出座標</div>

      <div style="border-top:1px solid #5a4020; padding-top:8px; margin:8px 0 6px; font-weight:700;">🎰 Spin 控制</div>
      <button class="dev-btn" data-action="spin">立即 Spin</button>
      <button class="dev-btn" data-action="reload">重整頁面</button>

      <style>
        #dev-panel .dev-btn, #dev-panel .dev-btn-mini {
          display: block; width: 100%; margin-bottom: 4px;
          background: linear-gradient(180deg, #2a1a08, #1a0e04);
          color: #f5d27a; border: 1px solid #5a4020; padding: 6px 10px;
          border-radius: 4px; cursor: pointer; font-size: 12px;
          text-align: left;
        }
        #dev-panel .dev-btn-mini { text-align: center; padding: 4px 0; font-size: 11px; }
        #dev-panel .dev-btn:hover, #dev-panel .dev-btn-mini:hover {
          background: linear-gradient(180deg, #4a2e14, #2a1a08);
          border-color: #d4a54a;
        }
        /* 手機版：DEV 面板變底部抽屜 + 大按鈕，浮動按鈕顯示 */
        @media (max-width: 600px) {
          #dev-toggle-btn { display: block !important; }
          #dev-panel {
            right: 0 !important; top: auto !important; bottom: 0 !important;
            max-width: 100% !important; width: 100% !important;
            max-height: 60vh !important;
            border-radius: 12px 12px 0 0 !important;
            padding: 16px !important;
          }
          #dev-panel .dev-btn { padding: 12px !important; font-size: 14px !important; }
          #dev-panel .dev-btn-mini { padding: 10px 0 !important; font-size: 13px !important; }
        }
      </style>
    </div>
    <script>
      // DEV 模式開關
      const devParam = new URLSearchParams(location.search).get('dev') === '1';
      const panel = document.getElementById('dev-panel');
      if (devParam) panel.style.display = 'block';
      window.addEventListener('keydown', e => {
        if (e.key === 'd' || e.key === 'D') {
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
      });
      document.getElementById('dev-close').onclick = () => panel.style.display = 'none';
      document.getElementById('dev-toggle-btn').onclick = () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      };

      // 按鈕事件路由
      panel.addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const arg = btn.dataset.arg;
        const game = window.__game;
        if (!game) { console.warn('Game not ready'); return; }
        const scene = game.scene.getScene('Main');
        if (!scene) { console.warn('Main scene not ready'); return; }
        try {
          switch (action) {
            case 'bigwin':       scene.bigWin?.(parseInt(arg)); break;
            case 'fg-start':     scene.enterFreeGame?.(); break;
            case 'fg-end':       scene.exitFreeGame?.(); break;
            case 'fg-total':
              scene.showMangaOverlay?.('mo_fg_total', { text: '12,345.67', textY: 50, holdMs: 1800, useGoldDigits: true });
              break;
            case 'overlay-scatter':
              scene.showMangaOverlay?.('mo_scatter', {
                text: '6', textX: -326, textY: -240, holdMs: 1500,
                useGoldDigits: true, digitW: 80, digitH: 115, gap: -4,
              });
              break;
            case 'overlay-scatter-edit':
              // 預設座標
              window.__lastDragCoord = { x: -326, y: -240 };
              scene.showMangaOverlay?.('mo_scatter', {
                text: '6', textX: -326, textY: -240, holdMs: 999999,
                useGoldDigits: true, digitW: 80, digitH: 115, gap: -4,
                editable: true,
              });
              document.getElementById('coord-display').style.display = 'block';
              document.getElementById('copy-coord-btn').style.display = 'block';
              if (window.__coordPollTimer) clearInterval(window.__coordPollTimer);
              window.__coordPollTimer = setInterval(() => {
                const c = window.__lastDragCoord;
                if (c) {
                  document.getElementById('coord-input').value = `textX: ${c.x}, textY: ${c.y}`;
                }
              }, 100);
              break;
            case 'copy-coord':
              const inp = document.getElementById('coord-input');
              inp.select();
              try {
                navigator.clipboard.writeText(inp.value)
                  .then(() => alert(`已複製：\n${inp.value}\n\n貼給 Claude 即可更新`))
                  .catch(() => {
                    document.execCommand('copy');
                    alert(`已複製（用 fallback）：\n${inp.value}`);
                  });
              } catch (err) {
                document.execCommand('copy');
                alert(`已複製：\n${inp.value}`);
              }
              break;
            case 'overlay-mult':
              scene.showMangaOverlay?.('mo_mult', {
                text: `x${arg}`, textY: -50, holdMs: 1000,
                useGoldDigits: true, digitW: 70, digitH: 100, gap: -6,
              });
              break;
            case 'page':
              if (scene.chapterBg) {
                const idx = Math.min(parseInt(arg), 10);
                const isMobile = scene.L?.mode === 'mobile';
                const k = String(idx).padStart(2, '0');
                const key = isMobile ? `mbl_panel_${k}` : `v6_page_${k}`;
                if (scene.textures.exists(key)) {
                  scene.chapterBg.setTexture(key);
                  if (isMobile) {
                    scene._mobileBgIdx = idx - 1;
                  } else {
                    scene._currentPageIdx = idx - 1;
                  }
                }
              }
              break;
            case 'page-next':
              if (scene.L?.mode === 'mobile') {
                const next = ((scene._mobileBgIdx ?? 0) + 1) % (scene._mobileBgCount ?? 10);
                scene._mobileBgIdx = next;
                const k = String(next + 1).padStart(2, '0');
                scene.chapterBg?.setTexture(`mbl_panel_${k}`);
              } else {
                scene.advanceTopStoryPanels?.();
              }
              break;
            case 'layout-edit':
              scene.enterLayoutEdit?.();
              break;
            case 'spin':
              scene.onSpin?.();
              break;
            case 'reload':
              location.reload();
              break;
          }
        } catch (err) { console.error('DEV action error:', err); }
      });
    </script>
    <!-- ============== /DEV ============== -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
