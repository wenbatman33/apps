<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12100E">
<title>防守特洛伊 — Troy Defense</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12100E; touch-action:none;
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",serif; }
  /* 不要用 flex 置中 — 會和 Phaser 的 Scale.CENTER_BOTH 打架造成偏移 */
  #app { position:fixed; inset:0; }
  canvas { display:block; margin:0 auto; }
  /* 橫向提示 */
  #rotate { position:fixed; inset:0; z-index:99; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; background:#12100E; color:#EDE0C8; }
  @media (orientation:landscape) and (max-height:500px) {
    #rotate { display:flex; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="rotate">
  <div style="font-size:64px">📱</div>
  <div style="font-size:22px;color:#D4A017">請將手機轉為直向遊玩</div>
</div>

<script src="vendor/phaser.min.js"></script>

<script src="src/config/layout.js"></script>
<script src="src/config/units.js"></script>
<script src="src/config/enemies.js"></script>
<script src="src/config/levels.js"></script>
<script src="src/config/heroes.js"></script>
<script src="src/config/boons.js"></script>

<script src="src/game/Save.js"></script>
<script src="src/game/Audio.js"></script>
<script src="src/game/Fx.js"></script>
<script src="src/game/Grid.js"></script>
<script src="src/game/Unit.js"></script>
<script src="src/game/Enemy.js"></script>

<script src="src/dev/DevTools.js"></script>

<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/TitleScene.js"></script>
<script src="src/scenes/CodexScene.js"></script>
<script src="src/scenes/GameScene.js"></script>

<script src="src/main.js"></script>
</body>
</html>
