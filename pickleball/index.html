<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>Pickleball Arena 3D — 室內匹克球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0f16; touch-action:none; overscroll-behavior:none;
    font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  #game-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* ===== 載入畫面（唯一的非 canvas UI，載入完成即移除） ===== */
  #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 40%, #16233a 0%, #0b0f16 70%); color:#eaf2ff; z-index:50; transition:opacity .4s; }
  #loader .t { font-size:28px; font-weight:900; letter-spacing:4px; color:#ffd23f; }
  #loader .bar { width:200px; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  #loader .bar span { display:block; width:40%; height:100%; background:#ffd23f; border-radius:3px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(260%)} }
  /* ===== DEV 開發者工具（預設隱藏） ===== */
  .hidden { display:none !important; }
  #btn-dev { position:fixed; right:10px; bottom:10px; z-index:60; width:38px; height:38px; border-radius:19px; border:1px solid rgba(255,255,255,.25);
    background:rgba(10,14,22,.75); color:#fff; font-size:18px; cursor:pointer; }
  #dev-panel { position:fixed; right:0; top:0; bottom:0; width:320px; max-width:92vw; z-index:70; overflow-y:auto; background:rgba(10,13,20,.94);
    color:#dfe7f3; font-size:12px; padding:10px 12px 40px; border-left:1px solid rgba(255,255,255,.12); backdrop-filter:blur(6px); }
  #dev-panel h3 { font-size:13px; margin:12px 0 6px; color:#ffd23f; letter-spacing:1px; }
  #dev-panel .row { display:grid; grid-template-columns:96px 1fr 52px; gap:6px; align-items:center; margin:3px 0; }
  #dev-panel .row label { color:#b9c6d8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dev-panel input[type=range] { width:100%; }
  #dev-panel .val { text-align:right; font-variant-numeric:tabular-nums; color:#fff; }
  #dev-panel .btns { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  #dev-panel button { background:#243247; color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  #dev-panel button.on { background:#2d55d8; }
  #dev-panel textarea { width:100%; height:120px; background:#070a10; color:#9fe6b0; border:1px solid rgba(255,255,255,.15); border-radius:8px; font:11px monospace; padding:6px; }
  #dev-panel .tip { color:#8fa1bb; font-size:11px; margin:4px 0; line-height:1.5; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="loader"><div class="t">PICKLEBALL</div><div class="bar"><span></span></div><div style="font-size:12px;color:#8fa1bb;letter-spacing:2px">LOADING ARENA</div></div>

<!-- DEV 開發者工具：D 鍵或右下角 ⚙ 開關 -->
<button id="btn-dev" class="hidden" title="開發者工具 (D)">⚙</button>
<div id="dev-panel" class="hidden"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./src/main.js?v=20260902b"></script>
</body>
</html>
