<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Royal Casino — 3D 娛樂城大廳</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060409; }
  body { font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 開場漸入 */
  #fade {
    position: fixed; inset: 0; background: #060409; z-index: 50;
    pointer-events: none; transition: opacity 1.6s ease;
  }

  /* 邊緣暗角，增加電影感 */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
  }

  /* 底部操作提示 */
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 230, 190, 0.75); font-size: 13px; letter-spacing: 1px;
    z-index: 10; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    white-space: nowrap;
  }

  /* 滑過機台的名牌提示 */
  #tooltip {
    position: fixed; z-index: 20; pointer-events: none; display: none;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(20, 10, 24, 0.85); border: 1px solid rgba(255, 200, 120, 0.5);
    color: #ffe6b3; font-size: 14px; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 12px rgba(255, 180, 80, 0.15);
    transform: translate(-50%, -140%);
  }

  /* 機台互動彈窗 */
  #modal {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: flex-end; justify-content: center; pointer-events: none;
  }
  #modal.show { display: flex; }
  #modal .card {
    pointer-events: auto; margin-bottom: 60px;
    background: linear-gradient(160deg, rgba(30, 16, 36, 0.92), rgba(12, 6, 16, 0.94));
    border: 1px solid rgba(255, 200, 120, 0.45); border-radius: 18px;
    padding: 22px 34px 20px; text-align: center; min-width: 300px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.7), 0 0 40px rgba(255, 60, 130, 0.12);
    backdrop-filter: blur(8px);
    animation: cardIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.92); } }
  #modal .m-name {
    font-size: 24px; font-weight: 800; color: #ffe6b3; letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(255, 190, 90, 0.5);
  }
  #modal .m-sub { font-size: 12px; color: rgba(255, 220, 180, 0.55); margin-top: 4px; letter-spacing: 3px; }
  #modal .m-btns { display: flex; gap: 12px; margin-top: 18px; }
  #modal button {
    flex: 1; border: none; border-radius: 12px; padding: 13px 20px;
    font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 2px;
    font-family: inherit; transition: transform 0.12s ease, filter 0.12s ease;
  }
  #modal button:hover { transform: translateY(-2px); filter: brightness(1.15); }
  #modal button:active { transform: translateY(0); }
  #btnPlay {
    background: linear-gradient(160deg, #ffd166, #e8912a);
    color: #3a1e00; box-shadow: 0 4px 18px rgba(255, 170, 50, 0.35);
  }
  #btnBack {
    background: rgba(255, 255, 255, 0.08); color: rgba(255, 230, 200, 0.8);
    border: 1px solid rgba(255, 220, 180, 0.25) !important;
  }

  /* DEV 工具齒輪按鈕 */
  #devBtn {
    position: fixed; right: 14px; bottom: 14px; z-index: 40;
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20, 12, 26, 0.7); color: rgba(255, 220, 180, 0.6);
    font-size: 18px; cursor: pointer; opacity: 0.35; transition: opacity 0.2s;
  }
  #devBtn:hover { opacity: 1; }

  /* DEV 模式提示 */
  #devTip {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: none; padding: 6px 16px; border-radius: 8px;
    background: rgba(200, 60, 60, 0.85); color: #fff; font-size: 12px; letter-spacing: 1px;
  }

  /* lil-gui 位置微調 */
  .lil-gui.root { --width: 300px; max-height: 90vh; z-index: 45 !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
  <div id="hint">🖱️ 拖曳環視 ・ 點擊地板走動 ・ 點擊機台進入遊戲 ・ D 開發者工具</div>
  <div id="tooltip"></div>
  <div id="devTip">🛠 DEV 模式 — 可直接拖曳機台調整位置，調完按面板裡「💾 匯出設定」</div>
  <button id="devBtn" title="開發者微調工具 (D)">⚙️</button>

  <div id="modal">
    <div class="card">
      <div class="m-name" id="mName">—</div>
      <div class="m-sub" id="mSub">SLOTS ・ ROYAL CASINO</div>
      <div class="m-btns">
        <button id="btnBack">↩ 返回大廳</button>
        <button id="btnPlay">🎰 進入遊戲</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=20"></script>
</body>
</html>
