<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>五關道路拓撲驗證</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101416;color:#f5f0e6;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
    main{width:min(1500px,100%);margin:auto;padding:22px}
    h1{margin:0 0 6px;font-size:28px}p{margin:0 0 20px;color:#bdc7c5}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:16px;align-items:start}
    article{background:#1c2325;border:1px solid #3b4949;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px #0008}
    h2{font-size:17px;margin:0;padding:11px 13px;background:#243033}
    .map{position:relative;aspect-ratio:9/16;background:#071a2d}
    .map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .map img:last-child{z-index:2}
    .links{display:flex;gap:8px;padding:10px}
    a{flex:1;text-align:center;color:white;background:#147eb3;text-decoration:none;border-radius:8px;padding:8px;font-size:13px}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){main{padding:10px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
