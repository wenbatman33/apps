<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Penalty Kicks 點球射門</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; background: #0a0a14; overflow: hidden; height: 100%; }
        #game-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 3D 底層 canvas（Three.js） */
        #three-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        /* Phaser canvas 由 Phaser 自行注入到 #phaser-container；透明背景疊在 three 之上 */
        #phaser-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #phaser-container canvas { background: transparent !important; }

        /* 直向時的「請轉橫向」提示層 */
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #06122a;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            color: #cfe0ff;
            text-align: center;
            font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        #rotate-overlay .rot-icon {
            font-size: 64px;
            margin-bottom: 18px;
            animation: rot-spin 1.6s ease-in-out infinite;
        }
        #rotate-overlay .rot-text { font-size: 22px; line-height: 1.6; }
        #rotate-overlay .rot-sub { font-size: 15px; color: #88aaff; margin-top: 8px; }
        @keyframes rot-spin {
            0%, 40% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-90deg); }
        }
    </style>
</head>
<body>
    <div id="game-root">
        <canvas id="three-canvas"></canvas>
        <div id="phaser-container"></div>
    </div>

    <!-- 直向提示層（手機請轉橫向） -->
    <div id="rotate-overlay">
        <div>
            <div class="rot-icon">📱</div>
            <div class="rot-text">請將手機轉為橫向</div>
            <div class="rot-sub">Please rotate your device to landscape</div>
        </div>
    </div>

    <!-- 第三方引擎（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>

    <!-- 專案程式碼 -->
    <script src="src/util/recolor.js"></script>
    <script src="src/core/constants.js"></script>
    <script src="src/core/Scenario.js"></script>
    <script src="src/core/projection.js"></script>
    <script src="src/scenes/PreloadScene.js"></script>
    <script src="src/scenes/MenuScene.js"></script>
    <script src="src/scenes/JerseyPocScene.js"></script>
    <script src="src/scenes/BallView.js"></script>
    <script src="src/scenes/GoalKeeperView.js"></script>
    <script src="src/scenes/PlayerView.js"></script>
    <script src="src/scenes/PlayScene.js"></script>
    <script src="src/main.js"></script>
    <script src="src/orientation.js"></script>
</body>
</html>
