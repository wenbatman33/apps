<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>dashRun</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; touch-action: none; }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 14px; color: #fff; z-index: 5; display: flex; gap: 8px; align-items: center;
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800;
    pointer-events: none; user-select: none;
  }
  #hud .chip {
    background: rgba(0,10,30,.38); border-radius: 999px; padding: 6px 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5); backdrop-filter: blur(3px);
    border: 1px solid rgba(255,255,255,.18);
  }
  #hud .score { font-size: 22px; letter-spacing: 1px; }
  #hud .rings { font-size: 18px; color: #ffd23f; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0, 20, 60, .55); backdrop-filter: blur(5px); z-index: 10; color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif; text-align: center; overflow-y: auto; padding: 16px 0;
  }
  #overlay h1 { font-size: 40px; margin: 0 0 2px; font-style: italic; letter-spacing: 2px;
    background: linear-gradient(180deg,#9be7ff,#1e6cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  #ovInfo { margin: 4px 0 0; font-size: 20px; font-weight: 800; color: #ffd23f; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  /* 角色预览 */
  #pvWrap {
    margin: 8px 0 2px; width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.28), rgba(120,180,255,.10) 62%, rgba(0,0,0,0) 72%);
    display: flex; align-items: center; justify-content: center;
  }
  #pv { width: 168px; height: 168px; }
  #pvName { font-size: 15px; font-weight: 800; margin: 0 0 6px; text-shadow: 0 2px 5px rgba(0,0,0,.5); }
  .selLabel { font-size: 12px; font-weight: 700; opacity: .75; letter-spacing: 3px; margin: 8px 0 5px; }
  .cardRow { display: flex; gap: 10px; justify-content: center; }
  .card {
    width: 86px; padding: 9px 4px 7px; border-radius: 14px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(8,20,48,.55); color: #fff; cursor: pointer; font-family: inherit;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .card .ic { font-size: 26px; line-height: 1.15; }
  .card .nm { font-size: 12px; font-weight: 800; margin-top: 3px; }
  .card:hover { transform: translateY(-2px); }
  .card.sel { border-color: #ffd23f; box-shadow: 0 0 14px rgba(255,210,63,.55); transform: translateY(-2px) scale(1.04); }
  .card.theme { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
  #overlay .btn {
    margin-top: 16px; padding: 13px 46px; font-size: 20px; font-weight: 800; color: #fff; border: none;
    border-radius: 999px; background: linear-gradient(180deg, #2f8bff, #0f55d8); cursor: pointer;
    box-shadow: 0 6px 0 #0a3a96, 0 10px 24px rgba(0,0,0,.4); font-family: inherit;
  }
  #overlay .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #0a3a96; }
  #overlay .btn.small { font-size: 13px; padding: 8px 22px; background: linear-gradient(180deg,#5a6780,#39455e); box-shadow: 0 4px 0 #222c40; margin-top: 10px; }
  #overlay .hint { margin: 12px 0 0; font-size: 12.5px; opacity: .75; }
  .hidden { display: none !important; }
  /* 教学横幅 */
  #tut {
    position: fixed; top: 16%; left: 50%; transform: translateX(-50%); z-index: 8;
    color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800;
    font-size: 24px; text-align: center; white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,.7); pointer-events: none; user-select: none;
  }
  #tut .sub { font-size: 15px; font-weight: 600; opacity: .85; margin-top: 6px; }
  #tut.pop { animation: tutPop .35s ease-out; }
  @keyframes tutPop { 0% { transform: translateX(-50%) scale(.6); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
  @media (max-width: 480px) {
    #hud .score { font-size: 18px; } #hud .rings { font-size: 15px; }
    #overlay h1 { font-size: 30px; }
    #pvWrap, #pv { width: 132px; height: 132px; }
    .card { width: 30vw; max-width: 96px; }
    #tut { font-size: 19px; white-space: normal; width: 92vw; }
  }
  /* 排行榜面板 */
  #lbPanel {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
    background: rgba(4, 12, 36, .88); backdrop-filter: blur(6px); color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif; padding: 22px 0 18px; overflow-y: auto;
  }
  #lbPanel h2 { margin: 0 0 14px; font-size: 30px; letter-spacing: 3px; color: #ffd23f;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #lbList { width: min(92vw, 420px); flex: 0 1 auto; }
  .lbRow {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 5px 0;
    background: rgba(255,255,255,.06); border-radius: 10px; font-weight: 700;
  }
  .lbRow.r1, .lbRow.r2, .lbRow.r3 { background: rgba(255,210,63,.14); }
  .lbRow .rk { flex: 0 0 42px; font-size: 16px; }
  .lbRow.r1 .rk { color: #ffd24a; } .lbRow.r2 .rk { color: #cfe3ff; } .lbRow.r3 .rk { color: #ffb37a; }
  .lbRow .ac { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbRow.me .ac { color: #ffd24a; font-weight: 800; }
  .lbRow .sc { font-size: 15px; color: #ffe27a; }
  .lbMsg { text-align: center; padding: 60px 0; opacity: .75; font-size: 16px; }
  .lbMsg.err { color: #ff8a8a; opacity: 1; }
  #lbTime { margin: 10px 0 2px; font-size: 13px; opacity: .8; min-height: 18px; }
  #lbTabs { display: flex; gap: 10px; margin: 8px 0 4px; }
  #lbTabs button {
    padding: 9px 26px; font-size: 15px; font-weight: 800; color: #fff; font-family: inherit;
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px; background: rgba(255,255,255,.10); cursor: pointer;
  }
  #lbTabs button.on { color: #ffd24a; border-color: #ffd24a; background: rgba(255,210,74,.22); }
  #lbClose {
    margin-top: 12px; padding: 10px 44px; font-size: 16px; font-weight: 800; color: #fff; border: none;
    border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
    cursor: pointer; font-family: inherit;
  }
  #ovUpload { margin: 6px 0 0; font-size: 12.5px; opacity: .7; }
  #ovUpload.warn { color: #ff8a8a; opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chip score">SCORE <span id="score">0</span></div>
  <div class="chip rings">⭕ <span id="ringCount">0</span></div>
</div>
<div id="overlay">
  <h1 id="ovTitle">dashRun</h1>
  <p id="ovInfo" class="hidden"></p>
  <p id="ovUpload" class="hidden"></p>
  <div id="pvWrap"><canvas id="pv" width="336" height="336"></canvas></div>
  <div id="pvName"></div>
  <div class="selLabel">选 择 角 色</div>
  <div id="charRow" class="cardRow"></div>
  <div class="selLabel">选 择 场 景</div>
  <div id="themeRow" class="cardRow"></div>
  <button class="btn" id="startBtn">开始游戏</button>
  <button class="btn small" id="tutBtn">📖 新手教学</button>
  <button class="btn small" id="lbBtn">🏆 排行榜</button>
  <p class="hint">← → 切换跑道 · Space / ↑ 跳跃 · 手机：左右滑换道、上滑跳跃</p>
</div>
<div id="tut" class="hidden"></div>
<div id="lbPanel" class="hidden">
  <h2>排行榜</h2>
  <div id="lbList"></div>
  <div id="lbTime"></div>
  <div id="lbTabs">
    <button data-tab="all">总榜</button>
    <button data-tab="today">今日</button>
    <button data-tab="yesterday">昨日</button>
  </div>
  <button id="lbClose">返回</button>
</div>
<script src="./leaderboard.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js", "three/addons/loaders/DRACOLoader.js": "./vendor/DRACOLoader.js" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
