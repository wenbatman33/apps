<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>世界盃手足球 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1020; font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: #fff; }
  body { user-select: none; -webkit-user-select: none; touch-action: none; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 13, 28, .82); backdrop-filter: blur(6px); padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }

  /* 主選單 */
  #screen-menu h1 { font-size: clamp(30px, 8vw, 52px); letter-spacing: 2px; text-shadow: 0 4px 24px #0af, 0 2px 0 #036; }
  #screen-menu .sub { margin: 10px 0 36px; opacity: .75; font-size: clamp(13px, 3.5vw, 16px); }
  .big-btn { font-size: clamp(18px, 5vw, 24px); padding: 14px 54px; border: none; border-radius: 40px; background: linear-gradient(180deg, #21c15b, #128a3c); color: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(20, 200, 90, .4); }
  .big-btn:active { transform: scale(.96); }
  .big-btn:disabled { filter: grayscale(1); opacity: .5; }
  #screen-menu .hint { margin-top: 28px; font-size: 12px; opacity: .5; line-height: 1.8; text-align: center; }

  /* 選隊 */
  #screen-teams { justify-content: flex-start; }
  #pick-title { font-size: clamp(18px, 5vw, 26px); font-weight: 700; margin: 6px 0 10px; }
  #pick-info { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .pick-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); border-radius: 20px; padding: 4px 12px; font-size: 13px; }
  .pick-chip canvas { border-radius: 3px; }
  #team-grid { flex: 1; overflow-y: auto; width: min(680px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; padding: 6px 2px 12px; touch-action: pan-y; }
  .team-card { background: rgba(255,255,255,.07); border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; transition: transform .08s; }
  .team-card:active { transform: scale(.95); }
  .team-card.sel { border-color: #21c15b; background: rgba(33,193,91,.18); }
  .team-card.dis { opacity: .3; }
  .team-card .flag { width: 56px; height: 37px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .team-card .tname { font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #diff-row { display: flex; gap: 8px; margin: 10px 0; }
  #diff-row button, .mini-btn { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; border-radius: 20px; padding: 7px 18px; font-size: 14px; cursor: pointer; }
  #diff-row button.on { background: #21c15b; border-color: #21c15b; font-weight: 700; }
  #teams-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; padding-bottom: 4px; }

  /* HUD 記分板 */
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 10px; background: rgba(8, 10, 22, .72); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 6px 14px; }
  #hud .side { display: flex; align-items: center; gap: 6px; }
  #hud canvas { border-radius: 3px; }
  #hud .nm { font-size: 13px; max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .sc { font-size: 24px; font-weight: 800; min-width: 26px; text-align: center; }
  #hud .colon { font-size: 20px; opacity: .6; }
  #btn-quit { margin-left: 6px; border: none; background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }

  /* 進球演出 */
  #goal-overlay { position: fixed; inset: 0; z-index: 18; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  #goal-overlay .goal-txt { font-size: clamp(48px, 14vw, 96px); font-weight: 900; color: #ffe14d; text-shadow: 0 0 30px #ff0, 0 6px 0 #a60; animation: goalPop .5s cubic-bezier(.2, 2.2, .4, 1); }
  #goal-overlay.opp .goal-txt { color: #ff6b6b; text-shadow: 0 0 30px #f33, 0 6px 0 #611; }
  #goal-team { font-size: clamp(18px, 5vw, 28px); font-weight: 700; margin-top: 6px; text-shadow: 0 2px 8px #000; }
  @keyframes goalPop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

  /* 結算 */
  #result-title { font-size: clamp(30px, 9vw, 56px); font-weight: 900; margin-bottom: 12px; }
  #result-score { font-size: clamp(18px, 5vw, 26px); margin-bottom: 30px; opacity: .9; }
  #screen-result .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* 主選單第二模式鈕 */
  .big-btn.alt { margin-top: 14px; background: linear-gradient(180deg, #3b82f6, #1d4ed8); box-shadow: 0 6px 18px rgba(59,130,246,.4); }

  /* HUD 計時器 */
  #hud-timer { font-size: 16px; font-weight: 800; color: #ffe14d; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
  #hud-timer.golden { color: #ff6b6b; font-size: 13px; }

  /* 錦標賽賽程表 */
  #screen-bracket { justify-content: flex-start; }
  #bracket-title { font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin: 8px 0 2px; color: #ffe14d; text-shadow: 0 2px 12px rgba(255,225,77,.35); }
  #bracket-sub { font-size: 13px; opacity: .75; margin-bottom: 10px; }
  #bracket-list { flex: 1; overflow-y: auto; width: min(560px, 100%); display: flex; flex-direction: column; gap: 6px; padding: 4px 2px 12px; touch-action: pan-y; }
  .bk-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border: 1px solid transparent; border-radius: 10px; padding: 7px 12px; font-size: 14px; }
  .bk-row.me { border-color: #21c15b; background: rgba(33,193,91,.14); }
  .bk-row canvas { border-radius: 3px; flex: 0 0 auto; }
  .bk-row .bk-n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-row .bk-n.right { text-align: right; }
  .bk-row .bk-s { font-weight: 800; min-width: 42px; text-align: center; color: #ffe14d; }
  .bk-row .win { color: #21c15b; }
  #btn-bracket-next { margin: 12px 0 4px; }

  /* 冠軍畫面 */
  #champ-trophy { font-size: clamp(80px, 22vw, 140px); animation: champPop 1s cubic-bezier(.2, 2, .4, 1); }
  #champ-flag { border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.6); margin: 14px 0 10px; }
  #champ-team { font-size: clamp(28px, 8vw, 44px); font-weight: 900; }
  #champ-sub { font-size: clamp(16px, 5vw, 22px); color: #ffe14d; margin: 8px 0 30px; }
  #screen-champion .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  @keyframes champPop { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.2) rotate(6deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }

  /* 一鍵揮桿按鈕列 */
  #kick-bar { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 15; display: flex; gap: 10px; }
  #kick-bar button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 8px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.22); background: rgba(8,10,22,.66); color: #fff; font-size: 20px; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #kick-bar button span { font-size: 12px; opacity: .85; }
  #kick-bar button:active, #kick-bar button.pressed { transform: scale(.92); background: rgba(33,193,91,.45); border-color: #21c15b; }
  #kick-bar .key { display: none; font-size: 10px; opacity: .55; line-height: 1; }
  @media (hover: hover) and (pointer: fine) { #kick-bar .key { display: block; } }
  #btn-track { margin-left: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #btn-track.on { border-color: #21c15b; background: rgba(33,193,91,.3); }
  #btn-track:not(.on) { opacity: .55; }

  /* DEV 工具 */
  #dev-toggle { position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 30; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(10,12,25,.6); color: #9ab; font-size: 18px; cursor: pointer; opacity: .55; }
  #dev-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(320px, 88vw); background: rgba(8,10,20,.94); border-left: 1px solid rgba(255,255,255,.15); overflow-y: auto; padding: 12px; touch-action: pan-y; }
  #dev-panel h3 { font-size: 15px; margin-bottom: 8px; color: #7fd; }
  .dev-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: #fc6; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 3px; }
  .dev-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 12px; }
  .dev-row label { flex: 0 0 108px; color: #cde; }
  .dev-row input[type=range] { flex: 1; }
  .dev-row span { flex: 0 0 40px; text-align: right; color: #8f8; }
  .dev-btns { flex-wrap: wrap; }
  .dev-btns button { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .dev-btns button.on { background: #21c15b; border-color: #21c15b; }
  #dev-export { width: 100%; font-size: 10px; background: #06121a; color: #9fd; border: 1px solid #345; border-radius: 6px; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- 主選單 -->
<div id="screen-menu" class="screen">
  <h1>⚽ 世界盃手足球</h1>
  <div class="sub">2026 世界盃 32 強 ・ 3D 桌上足球</div>
  <button id="btn-cup" class="big-btn">🏆 世界盃錦標賽</button>
  <button id="btn-play" class="big-btn alt">⚡ 快速對戰</button>
  <div class="hint">
    按住球桿附近拖曳 → 移動球員（保持直立）<br>
    點一下 → 踢球！下方按鈕 → 一鍵揮桿（PC 可按 1 2 3 4）<br>
    錦標賽：32 強單淘汰、每場 3 分鐘、平手黃金進球<br>
    快速對戰：先進 5 球獲勝・手機直版／PC 橫版
  </div>
</div>

<!-- 選隊 -->
<div id="screen-teams" class="screen hidden">
  <div id="pick-title">選擇你的隊伍</div>
  <div id="pick-info"></div>
  <div id="team-grid"></div>
  <div id="diff-row">
    <button data-d="easy">簡單</button>
    <button data-d="normal" class="on">普通</button>
    <button data-d="hard">困難</button>
  </div>
  <div id="teams-actions">
    <button id="btn-back-menu" class="mini-btn">← 返回</button>
    <button id="btn-random-opp" class="mini-btn hidden">🎲 隨機對手</button>
    <button id="btn-kickoff" class="big-btn" disabled>開賽！</button>
  </div>
</div>

<!-- HUD 記分板 -->
<div id="hud" class="hidden">
  <div class="side"><canvas id="flag-p" width="36" height="24"></canvas><span class="nm" id="name-p"></span></div>
  <span class="sc" id="score-p">0</span><span class="colon">:</span><span class="sc" id="score-a">0</span>
  <div class="side"><span class="nm" id="name-a"></span><canvas id="flag-a" width="36" height="24"></canvas></div>
  <span id="hud-timer" class="hidden">3:00</span>
  <button id="btn-track" class="on">🧲追球</button>
  <button id="btn-quit">選單</button>
</div>

<!-- 錦標賽賽程表 -->
<div id="screen-bracket" class="screen hidden">
  <div id="bracket-title"></div>
  <div id="bracket-sub"></div>
  <div id="bracket-list"></div>
  <button id="btn-bracket-next" class="big-btn"></button>
</div>

<!-- 冠軍畫面 -->
<div id="screen-champion" class="screen hidden">
  <div id="champ-trophy">🏆</div>
  <canvas id="champ-flag" width="120" height="80"></canvas>
  <div id="champ-team"></div>
  <div id="champ-sub">世界盃冠軍！！</div>
  <div class="row">
    <button id="btn-champ-again" class="big-btn">再戰一屆</button>
    <button id="btn-champ-menu" class="mini-btn">回主選單</button>
  </div>
</div>

<!-- 一鍵揮桿按鈕列 -->
<div id="kick-bar" class="hidden">
  <button data-kind="GK">🧤<span>守門</span><span class="key">1</span></button>
  <button data-kind="DEF">🛡️<span>後衛</span><span class="key">2</span></button>
  <button data-kind="MID">⚔️<span>中場</span><span class="key">3</span></button>
  <button data-kind="ATT">🎯<span>前鋒</span><span class="key">4</span></button>
</div>

<!-- 進球演出 -->
<div id="goal-overlay" class="hidden">
  <div class="goal-txt">GOAL!</div>
  <div id="goal-team"></div>
</div>

<!-- 結算 -->
<div id="screen-result" class="screen hidden">
  <div id="result-title"></div>
  <div id="result-score"></div>
  <div class="row">
    <button id="btn-rematch" class="big-btn">再來一場</button>
    <button id="btn-result-menu" class="mini-btn">回主選單</button>
  </div>
</div>

<!-- DEV 工具 -->
<button id="dev-toggle" title="開發者微調工具（D）">⚙</button>
<div id="dev-panel" class="hidden">
  <h3>DEV 微調工具（D 關閉）</h3>
  <div id="dev-body"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
