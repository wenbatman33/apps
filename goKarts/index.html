<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>疯狂卡丁车 GO — Crazy Karts GO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  button { font-family:inherit; }

  /* ============ 共用 ============ */
  .screen { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#fff; background:radial-gradient(ellipse at 50% 30%, #1d2b53 0%, #0b1020 70%);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(14px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom)); }
  /* 内容高於視窗時, flex 置中會把頂部裁掉且捲不到 → safe center 改為靠上並可捲動 */
  .screen { justify-content:safe center; }
  .screen > * { flex-shrink:0; }
  .hidden { display:none !important; }
  /* 主选单：主视觉背景 + 上下滚动格纹旗带 */
  #scr-main { background:
    linear-gradient(180deg, rgba(11,16,32,.30) 0%, rgba(11,16,32,.62) 55%, rgba(9,12,24,.90) 100%),
    url('assets/img/hero.jpg') center 30%/cover no-repeat,
    radial-gradient(ellipse at 50% 30%, #1d2b53 0%, #0b1020 70%); }
  #scr-main::before, #scr-main::after { content:""; position:fixed; left:-60px; right:-60px; height:16px; z-index:1;
    background:conic-gradient(#f2f2f2 90deg, #15181f 90deg 180deg, #f2f2f2 180deg 270deg, #15181f 270deg) 0 0/32px 32px;
    animation:checker-slide 1.6s linear infinite; opacity:.9; }
  #scr-main::before { top:0; transform:rotate(-1.2deg); }
  #scr-main::after { bottom:0; transform:rotate(1.2deg); animation-direction:reverse; }
  @keyframes checker-slide { to { background-position-x:32px; } }
  .title-lg { font-size:min(9vw,58px); font-weight:900; font-style:italic; letter-spacing:2px;
    background:linear-gradient(180deg,#ffe66d 20%,#ff9f1c 55%,#ff4d6d 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)); text-align:center;
    animation:title-bob 2.8s ease-in-out infinite; }
  @keyframes title-bob {
    0%, 100% { transform:translateY(0) rotate(-1deg); }
    50% { transform:translateY(-7px) rotate(1deg); }
  }
  .menu-btn { transition:transform .12s, box-shadow .08s, filter .12s; }
  .menu-btn:hover { transform:translateY(-2px) scale(1.03); filter:brightness(1.08); }
  .subtitle { font-size:min(4vw,17px); color:#9fb0c8; letter-spacing:6px; font-weight:700; }
  .menu-btn { min-width:min(70vw,300px); padding:15px 34px; font-size:19px; font-weight:800; color:#fff; cursor:pointer;
    border:none; border-radius:14px; letter-spacing:2px;
    background:linear-gradient(180deg,#3e7bfa,#2450c8); box-shadow:0 5px 0 #16327f, 0 8px 18px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s; }
  .menu-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #16327f; }
  .menu-btn.green { background:linear-gradient(180deg,#38c96f,#1f9d4e); box-shadow:0 5px 0 #10662f, 0 8px 18px rgba(0,0,0,.4); }
  .menu-btn.green:active { box-shadow:0 1px 0 #10662f; }
  .menu-btn.gold { background:linear-gradient(180deg,#ffb03a,#e07b00); box-shadow:0 5px 0 #8f4e00, 0 8px 18px rgba(0,0,0,.4); }
  .menu-btn.gold:active { box-shadow:0 1px 0 #8f4e00; }
  .back-btn { position:fixed; left:16px; top:calc(14px + env(safe-area-inset-top)); padding:9px 18px; font-size:15px; font-weight:700; color:#dfe7f3;
    background:rgba(8,12,20,.75); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.18); border-radius:10px; cursor:pointer; z-index:6; }
  /* 主行動按鈕貼底: 內容再長也一定看得到「下一步 / 出發」 */
  .cta-sticky { position:sticky; bottom:0; z-index:5; margin-top:4px;
    width:calc(100% + 20px); margin-left:-10px; margin-right:-10px;
    display:flex; justify-content:center;
    padding:16px 0 calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(11,16,32,0) 0%, rgba(11,16,32,.92) 40%, rgba(11,16,32,1) 100%); }
  .screen h2 { font-size:min(6.5vw,32px); font-weight:900; letter-spacing:3px; color:#ffe66d; text-shadow:0 3px 0 rgba(0,0,0,.4); }

  /* ============ 选卡片 ============ */
  .card-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:min(96vw,900px); }
  .sel-card { width:min(28vw,215px); border-radius:16px; padding:12px; cursor:pointer; text-align:center; color:#fff;
    background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14); transition:transform .12s,border-color .12s,background .12s; }
  .sel-card:hover { transform:translateY(-4px); }
  .sel-card.selected { border-color:#ffe66d; background:rgba(255,230,109,.12); box-shadow:0 0 22px rgba(255,230,109,.25); }
  .sel-card .thumb { width:100%; aspect-ratio:16/10; border-radius:10px; margin-bottom:8px; background-size:cover; background-position:center; }
  .sel-card .nm { font-size:15px; font-weight:800; letter-spacing:1px; }
  .sel-card .ds { font-size:11px; color:#9fb0c8; margin-top:3px; line-height:1.5; }
  /* 车辆选择：3 栏网格（手机 2 栏），含车图 */
  #kart-cards { display:grid; grid-template-columns:repeat(3, min(29vw, 210px)); gap:14px; justify-content:center; }
  @media (max-width: 620px) {
    /* 手機: 2 欄 + 卡片緊湊化, 縮短捲動距離 */
    #kart-cards { grid-template-columns:repeat(2, 43vw); gap:9px; }
    .kart-card { padding:8px; }
    .kart-card .kthumb { aspect-ratio:1/1; margin-bottom:5px; }
    .sel-card .nm { font-size:13.5px; }
    .sel-card .ds { font-size:10px; margin-top:2px; }
    .statbar { margin-top:2px; }
    .statbar .bg { height:5px; }
    .screen h2 { font-size:22px; }
    .card-row { gap:9px; }
    .sel-card { width:min(43vw,215px); padding:8px; }
    .sel-card .thumb { margin-bottom:5px; }
  }
  .kart-card { width:auto; }
  .kart-card .kthumb { width:100%; aspect-ratio:4/3; border-radius:10px; margin-bottom:8px;
    background-size:cover; background-position:center; }
  .statbar { display:flex; align-items:center; gap:5px; margin-top:4px; }
  .statbar .lb { font-size:10px; color:#9fb0c8; width:26px; text-align:right; flex:none; }
  .statbar .bg { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  .statbar .fg { height:100%; border-radius:3px; background:linear-gradient(90deg,#38c96f,#ffe66d); }

  /* ============ HUD ============ */
  .hud { position:fixed; z-index:10; color:#fff; user-select:none; pointer-events:none; }
  .hud-panel { background:rgba(8,12,20,.55); backdrop-filter:blur(6px); border-radius:12px; border:1px solid rgba(255,255,255,.10); }
  #hud-pos { left:14px; top:calc(12px + env(safe-area-inset-top)); padding:6px 18px 8px 14px; display:flex; gap:14px; align-items:baseline; }
  #hud-pos .p { font-weight:900; font-style:italic; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,255,255,.25); display:flex; align-items:baseline; gap:2px; }
  #hud-pos .p .num { font-size:50px; line-height:1;
    background:linear-gradient(180deg,#ffffff 30%,#c9d6ea 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #hud-pos .p .suf { font-size:20px; color:#ffd23f; }
  #hud-pos .lap { font-size:15px; font-weight:800; color:#dfe7f3; letter-spacing:1px; }
  #hud-pos .lap b { color:#ffd23f; }
  #hud-times { right:14px; top:calc(12px + env(safe-area-inset-top)); padding:8px 13px; font-size:12.5px; min-width:158px; }
  #hud-times .row { display:flex; justify-content:space-between; gap:10px; line-height:1.7; }
  #hud-times .lbl { color:#9fb0c8; }
  #hud-times .val { font-variant-numeric:tabular-nums; font-weight:700; }
  #hud-times .best .val { color:#c478ff; }
  #hud-times .cur .val { color:#7CFC9B; }
  /* 弧形速度表：SVG 270° 弧 + 中央数字 */
  #hud-speed { right:16px; bottom:calc(14px + env(safe-area-inset-bottom)); width:132px; height:132px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud-speed svg { position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  #hud-speed .bg { fill:none; stroke:rgba(8,12,20,.55); stroke-width:9; stroke-linecap:round; }
  #hud-speed .fg { fill:none; stroke:#4fa8ff; stroke-width:9; stroke-linecap:round; stroke-dasharray:235.6; stroke-dashoffset:235.6; transition:stroke .2s; }
  #hud-speed .kmh { position:relative; font-size:40px; font-weight:900; font-style:italic; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.55); font-variant-numeric:tabular-nums; }
  #hud-speed .unit { position:relative; font-size:11px; color:#c9d6ea; font-weight:700; letter-spacing:1px; margin-top:2px; }
  body.touch #hud-speed { right:14px; bottom:calc(186px + env(safe-area-inset-bottom)); width:92px; height:92px; }
  body.touch #hud-speed .kmh { font-size:26px; }
  body.touch #hud-speed .bg, body.touch #hud-speed .fg { stroke-width:7; }
  #hud-item { left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top)); width:64px; height:64px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:36px; }
  #hud-item.flash { animation:itemflash .12s linear infinite; }
  body.touch #hud-item { top:calc(192px + env(safe-area-inset-top)); width:56px; height:56px; font-size:30px; }
  @keyframes itemflash { 50% { background:rgba(255,230,109,.4); } }
  #hud-center { left:50%; top:34%; transform:translate(-50%,-50%); font-size:min(17vw,110px); font-weight:900; font-style:italic;
    color:#ffe66d; text-shadow:0 5px 0 rgba(0,0,0,.5), 0 0 40px rgba(255,210,63,.5); text-align:center; white-space:nowrap; }
  #hud-msg { left:50%; top:52%; transform:translateX(-50%); font-size:min(6vw,30px); font-weight:800; color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.55); text-align:center; white-space:nowrap; }
  #minimap { left:14px; bottom:calc(14px + env(safe-area-inset-bottom)); border-radius:12px; opacity:.92; }
  body.touch #minimap { left:50%; transform:translateX(-50%); bottom:auto; top:calc(86px + env(safe-area-inset-top)); width:96px; height:96px; }
  #btn-pause { position:fixed; right:14px; top:calc(64px + env(safe-area-inset-top)); z-index:30; width:42px; height:42px; border-radius:10px;
    background:rgba(8,12,20,.55); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:17px; cursor:pointer; }
  body.touch #btn-pause { top:calc(74px + env(safe-area-inset-top)); right:auto; left:14px; }
  #btn-mute { position:fixed; left:14px; top:calc(70px + env(safe-area-inset-top)); z-index:30; width:42px; height:42px; border-radius:10px;
    background:rgba(8,12,20,.55); border:1px solid rgba(255,255,255,.15); color:#fff; font-size:17px; cursor:pointer; }
  body.touch #btn-mute { top:calc(74px + env(safe-area-inset-top)); left:64px; }

  /* ============ 虚拟按键 ============ */
  #vpad { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; }
  body.touch.racing #vpad { display:block; }
  .vbtn { position:absolute; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:#fff; font-weight:900; user-select:none; -webkit-user-select:none;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.25); backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .vbtn.pressed { background:rgba(255,230,109,.35); border-color:#ffe66d; }
  #vb-left  { left:calc(14px + env(safe-area-inset-left)); bottom:calc(28px + env(safe-area-inset-bottom)); width:76px; height:76px; font-size:30px; }
  #vb-right { left:calc(102px + env(safe-area-inset-left)); bottom:calc(28px + env(safe-area-inset-bottom)); width:76px; height:76px; font-size:30px; }
  #vb-drift { right:calc(88px + env(safe-area-inset-right)); bottom:calc(36px + env(safe-area-inset-bottom)); width:70px; height:70px; font-size:15px; background:rgba(80,160,255,.18); border-color:rgba(120,180,255,.5); }
  #vb-item  { right:calc(18px + env(safe-area-inset-right)); bottom:calc(104px + env(safe-area-inset-bottom)); width:62px; height:62px; font-size:24px; background:rgba(255,180,60,.18); border-color:rgba(255,200,90,.5); }
  #vb-brake { right:calc(14px + env(safe-area-inset-right)); bottom:calc(26px + env(safe-area-inset-bottom)); width:64px; height:64px; font-size:14px; background:rgba(255,90,90,.16); border-color:rgba(255,120,120,.45); }

  /* ============ 结算/排行榜 ============ */
  .result-panel { background:rgba(10,16,28,.88); border:1px solid rgba(255,255,255,.14); border-radius:18px;
    padding:22px 26px; max-width:min(92vw,460px); width:100%; max-height:78vh; overflow-y:auto; }
  .result-panel h3 { font-size:22px; color:#ffe66d; letter-spacing:2px; margin-bottom:12px; text-align:center; }
  .rtable { width:100%; border-collapse:collapse; font-size:14px; }
  .rtable td, .rtable th { padding:7px 8px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); }
  .rtable th { color:#9fb0c8; font-size:12px; font-weight:700; }
  .rtable .me { color:#ffe66d; font-weight:800; }
  .rtable .rank { width:34px; font-weight:800; font-style:italic; }
  .rtable .tval { font-variant-numeric:tabular-nums; text-align:right; }
  #name-entry { display:flex; gap:8px; margin:12px 0; }
  #name-input { flex:1; padding:10px 12px; font-size:16px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); color:#fff; outline:none; }
  .btn-row { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn-sm { padding:11px 20px; font-size:15px; font-weight:800; color:#fff; border:none; border-radius:10px; cursor:pointer; letter-spacing:1px; }
  .btn-sm.blue { background:linear-gradient(180deg,#3e7bfa,#2450c8); box-shadow:0 3px 0 #16327f; }
  .btn-sm.green { background:linear-gradient(180deg,#38c96f,#1f9d4e); box-shadow:0 3px 0 #10662f; }
  .btn-sm.grey { background:rgba(255,255,255,.12); box-shadow:0 3px 0 rgba(0,0,0,.4); }
  .btn-sm:active { transform:translateY(3px); box-shadow:none; }
  .lb-tabs { display:flex; gap:8px; margin-bottom:12px; justify-content:center; }
  .lb-tab { padding:8px 14px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; color:#9fb0c8;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
  .lb-tab.on { color:#0b1020; background:#ffe66d; border-color:#ffe66d; }
  .empty-note { color:#9fb0c8; text-align:center; padding:20px 0; font-size:14px; }

  #fade { position:fixed; inset:0; z-index:60; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; }
  #fade.on { opacity:1; pointer-events:auto; }

  #controls-hint { margin-top:14px; display:flex; flex-direction:column; gap:7px; align-items:center; max-width:92vw; }
  .ch-row { color:#9fb0c8; font-size:min(3.4vw,13.5px); line-height:1.55; text-align:center; }
  .ch-row b { color:#ffe66d; font-weight:700; }
  .ch-tag { display:inline-block; margin-right:8px; padding:2px 9px; border-radius:8px; font-size:11.5px; font-weight:700;
    color:#dfe7f3; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); }
</style>
</head>
<body>
<div id="app"></div>

<!-- ============ 主选单 ============ -->
<div id="scr-main" class="screen">
  <div class="title-lg">疯狂卡丁车 GO</div>
  <div class="subtitle">CRAZY KARTS GO</div>
  <div style="height:8px"></div>
  <button class="menu-btn green" id="btn-gp">🏁 大奖赛（道具战）</button>
  <button class="menu-btn" id="btn-tt">⏱️ 计时挑战</button>
  <button class="menu-btn gold" id="btn-lb">🏆 排行榜</button>
  <div id="controls-hint">
    <div class="ch-row"><span class="ch-tag">💻 PC</span>↑/W 油门 · ←→/AD 转向 · <b>按住 Shift 或空白键＋转向＝漂移</b>（放开喷射加速）· <b>Enter 或 E＝丢道具</b></div>
    <div class="ch-row"><span class="ch-tag">📱 手机</span>自动油门 · ◀▶ 转向 · <b>按住「漂移」键过弯</b>（放开喷射）· <b>点 🎁＝丢道具</b></div>
    <div class="ch-row" style="opacity:.65">建议开启声音体验 🔊 · 比赛中按 <b>`</b> 开启 DEV 微调面板</div>
  </div>
</div>

<!-- ============ 赛道选择 ============ -->
<div id="scr-track" class="screen hidden">
  <button class="back-btn" data-back="scr-main">← 返回</button>
  <h2>选择赛道</h2>
  <div class="card-row" id="track-cards"></div>
  <div class="cta-sticky"><button class="menu-btn green" id="btn-track-next">下一步 →</button></div>
</div>

<!-- ============ 车辆选择 ============ -->
<div id="scr-kart" class="screen hidden">
  <button class="back-btn" data-back="scr-track">← 返回</button>
  <h2>选择车辆</h2>
  <div class="card-row" id="kart-cards"></div>
  <div class="cta-sticky"><button class="menu-btn green" id="btn-kart-go">出发！🏁</button></div>
</div>

<!-- ============ 排行榜 ============ -->
<div id="scr-lb" class="screen hidden">
  <button class="back-btn" data-back="scr-main">← 返回</button>
  <h2>🏆 计时赛排行榜</h2>
  <div class="result-panel">
    <div class="lb-tabs" id="lb-tabs"></div>
    <div id="lb-content"></div>
  </div>
</div>

<!-- ============ 暂停 ============ -->
<div id="scr-pause" class="screen hidden" style="background:rgba(5,8,16,.72)">
  <h2>暂停</h2>
  <button class="menu-btn green" id="btn-resume">▶ 继续</button>
  <button class="menu-btn" id="btn-restart">↻ 重新开始</button>
  <button class="menu-btn gold" id="btn-quit">🏠 回主选单</button>
</div>

<!-- ============ 结算 ============ -->
<div id="scr-result" class="screen hidden" style="background:rgba(5,8,16,.8)">
  <div class="result-panel">
    <h3 id="result-title">比赛结束</h3>
    <div id="result-body"></div>
    <div class="btn-row">
      <button class="btn-sm green" id="btn-r-retry">↻ 再跑一次</button>
      <button class="btn-sm blue" id="btn-r-menu">🏠 主选单</button>
    </div>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud-root" class="hidden">
  <div id="hud-pos" class="hud hud-panel"><span class="p"><span class="num">1</span><span class="suf">st</span></span><span class="lap">LAP <b>1</b>/3</span></div>
  <div id="hud-times" class="hud hud-panel">
    <div class="row cur"><span class="lbl">单圈</span><span class="val" id="t-cur">0:00.000</span></div>
    <div class="row best"><span class="lbl">最速圈</span><span class="val" id="t-best">--:--.---</span></div>
    <div class="row"><span class="lbl">总时间</span><span class="val" id="t-total">0:00.000</span></div>
  </div>
  <div id="hud-item" class="hud hud-panel"></div>
  <div id="hud-speed" class="hud">
    <svg viewBox="0 0 120 120"><path class="bg" d="M24.6 95.4 A50 50 0 1 1 95.4 95.4"/><path class="fg" id="speed-arc" d="M24.6 95.4 A50 50 0 1 1 95.4 95.4"/></svg>
    <span class="kmh">0</span><span class="unit">km/h</span>
  </div>
  <div id="hud-center" class="hud"></div>
  <div id="hud-msg" class="hud"></div>
  <canvas id="minimap" class="hud" width="132" height="132"></canvas>
  <button id="btn-pause">⏸</button>
  <button id="btn-mute">🔊</button>
</div>

<!-- ============ 虚拟按键 ============ -->
<div id="vpad">
  <div class="vbtn" id="vb-left">◀</div>
  <div class="vbtn" id="vb-right">▶</div>
  <div class="vbtn" id="vb-drift">漂移</div>
  <div class="vbtn" id="vb-item">🎁</div>
